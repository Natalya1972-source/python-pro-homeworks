{% load static %}

<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        {% block title %}
        Книжковий магазин
        {% endblock %}
    </title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Наш CSS -->
    <link
        rel="stylesheet"
        href="{% static 'books/css/style.css' %}"
    >
</head>

<body>

<header>

    <div class="logo">
        📚 Моя книжкова полиця
    </div>

    <nav>
        <a href="{% url 'books:home' %}">
            Головна
        </a>

        <a href="{% url 'books:book_list' %}">
            Каталог
        </a>

        <a href="{% url 'books:add_book' %}">
            Додати книгу
        </a>

        <a href="{% url 'books:book_stats' %}">
            Статистика
        </a>

        <a href="/admin/">
            Адмінка
        </a>
    </nav>

</header>


<div class="container">

    {% block content %}
    {% endblock %}

</div>


<footer>
    Книжковий магазин • Django
</footer>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
