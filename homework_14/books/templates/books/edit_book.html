{% extends "books/base.html" %}

{% block title %}
Редагувати книгу
{% endblock %}

{% block content %}

<div class="form-card">

    <h1>
        Редагувати книгу
    </h1>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Зберегти зміни
        </button>

    </form>

    <a
        class="button"
        href="{% url 'books:book_detail' book.pk %}"
    >
        ← Назад
    </a>

</div>

{% endblock %}
