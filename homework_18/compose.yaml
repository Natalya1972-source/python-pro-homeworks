services:

  db:
    image: postgres:17

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  redis:
    image: redis:7-alpine

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 3s
      retries: 10


  web:
    build: .

    env_file:
      - .env

    depends_on:
      db:
        condition: service_healthy

      redis:
        condition: service_healthy

    ports:
      - "8000:8000"

    volumes:
      - .:/app
      - static_data:/app/staticfiles

    command:
      [
        "python",
        "manage.py",
        "runserver",
        "0.0.0.0:8000"
      ]


volumes:
  postgres_data:
  static_data: