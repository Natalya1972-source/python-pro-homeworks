<header>

    <div class="logo">
        📚 Моя книжкова полиця
    </div>

    <nav>

        <a href="{% url 'books:home' %}">
            Головна
        </a>

        <a href="{% url 'books:book_list' %}">
            Каталог
        </a>

        <a href="{% url 'books:add_book' %}">
            Додати книгу
        </a>

        <a href="{% url 'books:book_stats' %}">
            Статистика
        </a>

        <a href="/admin/">
            Адмінка
        </a>


        {% if user.is_authenticated %}

            <span>
                Вітаємо, {{ user.username }}
            </span>

            <form
                method="post"
                action="{% url 'logout' %}"
            >
                {% csrf_token %}

                <button type="submit">
                    Вийти
                </button>
            </form>

        {% else %}

            <a href="{% url 'login' %}">
                Увійти
            </a>

            <a href="{% url 'register' %}">
                Реєстрація
            </a>

        {% endif %}

    </nav>

</header>
