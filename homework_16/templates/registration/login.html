{% extends "base.html" %}

{% block title %}
Вхід
{% endblock %}

{% block content %}

<div class="form-card">

    <h1>Вхід до книжкового магазину</h1>

    {% if form.errors %}
        <p>
            Неправильне ім'я користувача або пароль.
        </p>
    {% endif %}

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Увійти
        </button>

    </form>

    <a
        class="button"
        href="{% url 'books:home' %}"
    >
        ← На головну
    </a>

</div>

{% endblock %}
